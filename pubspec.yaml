name: gami_ai
description: GamiAI recruitment platform workspace.
publish_to: none
environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/core

dev_dependencies:
  melos: ^8.7.0
  very_good_analysis: ^11.0.0

melos:
  scripts:
    bootstrap:
      description: Resolve workspace dependencies.
      run: dart pub get
    analyze:
      description: Analyze all Flutter packages.
      run: dart run melos exec --fail-fast -- flutter analyze --fatal-infos
    test:
      description: Run tests in packages that have a test directory.
      run: dart run melos exec --fail-fast --dir-exists=test -- flutter test
    format:
      description: Format Dart code.
      run: dart format .
    generate:
      description: Generate localizations.
      run: dart run melos exec --file-exists=l10n.yaml -- flutter gen-l10n
    verify:
      description: Format check, analyze, test, then architecture rules.
      run: >-
        dart format --set-exit-if-changed .
        && dart run melos run analyze
        && dart run melos run test
        && dart tool/verify_architecture.dart
